[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pipesight-backend"
version = "1.9.0"
description = "PipeSight 国家管网科技情报与科研辅助平台后端"
requires-python = ">=3.10"
dependencies = [
    "aiofiles==25.1.0",
    "aiohttp==3.12.7",
    "aiokafka==0.12.0",
    "alembic==1.18.3",
    "anthropic==0.78.0",
    "apscheduler==3.11.2",
    "async-lru==2.1.0",
    "asyncpg==0.31.0",
    "bcrypt==5.0.0",
    "cerebras-cloud-sdk==1.67.0",
    "cohere==5.20.4",
    "fastapi[all]==0.128.2",
    "google-genai==1.62.0",
    "groq==1.0.0",
    "httpx==0.28.1",
    "jinja2>=3.1.6",
    "json-repair==0.46.0",
    "litellm==1.81.8",
    "llama-api-client==0.6.0",
    "loguru==0.7.3",
    "mistralai==1.12.0",
    "miniopy-async==1.23.1",
    "ollama==0.6.1",
    "numpy==2.2.6",
    "openai==2.17.0",
    "opencc==1.1.9",
    "openpyxl==3.1.5",
    "opencv-python==4.12.0.88",
    "pandas==2.3.3",
    "pillow==12.1.1",
    "portkey-ai==2.1.0",
    "psutil==7.2.2",
    "psycopg2-binary==2.9.11",
    "pydantic>=2.11.4",
    "pydantic-settings==2.9.1",
    "pydantic-validation-decorator==0.1.5",
    "pyjwt[crypto]==2.11.0",
    "pypdf==6.5.0",
    "python-docx==1.2.0",
    "python-dotenv==1.1.0",
    "reportlab==4.4.4",
    "redis==7.1.0",
    "rapidfuzz==3.13.0",
    "ruff==0.15.0",
    "sqlalchemy[asyncio]==2.0.46",
    "sqlglot[rs]==28.10.0",
    "textual==8.2.5",
    "tenacity==9.1.2",
    "user-agents==2.2.0",
]

[project.scripts]
ruoyi = "cli.main:main"
pipesight-api = "app.entrypoints.api:main"
pipesight-task-worker = "app.entrypoints.task_worker:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["server"]
packages = [
    "app", "app.entrypoints", "app.health", "app.health.api",
    "app.infrastructure", "app.infrastructure.api", "app.infrastructure.schemas", "app.infrastructure.models", "app.infrastructure.repositories", "app.infrastructure.services",
    "app.system", "app.system.api", "app.system.schemas", "app.system.models", "app.system.repositories", "app.system.services",
    "app.intelligence", "app.intelligence.api", "app.intelligence.schemas", "app.intelligence.services",
    "app.intelligence.integrations", "app.intelligence.tasks",
    "app.intelligence.repositories", "app.intelligence.models", "app.intelligence.api",
    "app.intelligence.processing", "app.intelligence.processing.config", "app.intelligence.processing.config.constants",
    "app.intelligence.processing.db", "app.intelligence.processing.domain",
    "app.intelligence.processing.email_support", "app.intelligence.processing.models",
    "app.intelligence.processing.processors", "app.intelligence.processing.prompts",
    "app.intelligence.processing.prompts.ai_intelligence_prompts",
    "app.intelligence.processing.prompts.biology_prompts",
    "app.intelligence.processing.prompts.common_prompts",
    "app.intelligence.processing.prompts.open_source_intelligence_prompts",
    "app.intelligence.processing.prompts.politics_prompts",
    "app.intelligence.processing.prompts.security_prompts",
    "app.intelligence.processing.prompts.seed_prompts",
    "app.intelligence.processing.prompts.space_prompts",
    "app.intelligence.processing.prompts.synthetic_biology_prompts",
    "app.intelligence.processing.prompts.tech_prompts",
    "app.intelligence.processing.prompts.water_prompts",
    "app.intelligence.processing.runtime", "app.intelligence.processing.services",
    "app.library", "app.library.api", "app.library.models", "app.library.repositories", "app.library.schemas", "app.library.services", "app.library.tasks", "app.research", "app.research.api", "app.research.schemas",
    "app.research.models", "app.research.repositories", "app.research.services", "app.research.tasks",
    "cli", "cli.completion", "cli.core", "cli.groups", "cli.groups.app",
    "cli.groups.cache", "cli.groups.config", "cli.groups.crypto", "cli.groups.db",
    "cli.groups.dev", "cli.groups.job", "cli.groups.ops",
    "cli.metadata", "cli.runtime", "cli.runtime.app", "cli.runtime.cache",
    "cli.runtime.config", "cli.runtime.crypto", "cli.runtime.db", "cli.runtime.dev",
    "cli.runtime.job", "cli.runtime.ops", "cli.tui",
    "cli.tui.actions", "cli.tui.actions.factories", "cli.tui.adapters", "cli.tui.copy",
    "cli.tui.screens", "cli.tui.widgets", "cli.wizard", "cli.wizard.flows",
    "common", "common.annotation", "common.aspect", "common.http", "common.ports", "config", "exceptions",
    "middlewares", "middlewares.trace_middleware",
    "sub_applications",
]

[tool.setuptools.package-data]
"app.intelligence.processing" = ["supported_text/*.txt", "email_support/templates/*"]

[tool.setuptools.package-dir]
app = "src/app"
