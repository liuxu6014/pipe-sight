name: pipesight-pg

services:
  # 数据库迁移：API 和持久任务 Worker 启动前必须完成 Alembic 迁移。
  # 数据库地址必须显式提供；本项目不随此部署文件启动或初始化 PostgreSQL。
  pipesight-db-migrate:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/backend.pg.Dockerfile
    image: ruoyi-backend-pg:latest
    command: ["pipesight-safe-migrate"]
    environment:
      APP_ENV: dockerpg
      APP_RELOAD: "false"
      APP_ROOT_PATH: /docker-api
      PIPESIGHT_MIGRATION_TARGET: ${PIPESIGHT_MIGRATION_TARGET:-head}
      PIPESIGHT_MIGRATION_OPTIONS_FILE: ${PIPESIGHT_MIGRATION_OPTIONS_FILE:-}
      DB_TYPE: postgresql
      PYTHONPATH: /app/src:/app
      DB_HOST: ${DATA_DB_HOST:?Set the explicit target DATA_DB_HOST}
      DB_PORT: ${DATA_DB_PORT:-5432}
      DB_USERNAME: ${DATA_DB_USERNAME:-postgres}
      DB_PASSWORD: ${DATA_DB_PASSWORD:?Set DATA_DB_PASSWORD}
      DB_DATABASE: ${DATA_DB_DATABASE:-pipesight}
      DB_ECHO: "false"
    volumes:
      - ${PIPESIGHT_MIGRATION_DIR:-./deploy/migrations}:/app/migration:ro
    networks:
      - ruoyi-network

  # 前端服务
  ruoyi-frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/docker/frontend.Dockerfile
    image: ruoyi-frontend:latest
    restart: unless-stopped
    ports:
      - "12580:80"
    volumes:
      - ./deploy/nginx/postgres.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      ruoyi-backend-pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ruoyi-network

  # 后端服务（PostgreSQL版本）
  ruoyi-backend-pg:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/backend.pg.Dockerfile
    image: ruoyi-backend-pg:latest
    restart: unless-stopped
    command: ["sh", "-c", "pipesight-runtime-check && exec ruoyi app run --env=dockerpg"]
    environment:
      APP_ENV: dockerpg
      APP_RELOAD: "false"
      APP_ROOT_PATH: /docker-api
      DB_TYPE: postgresql
      PYTHONPATH: /app/src:/app
      DB_HOST: ${DATA_DB_HOST:?Set the explicit target DATA_DB_HOST}
      DB_PORT: ${DATA_DB_PORT:-5432}
      DB_USERNAME: ${DATA_DB_USERNAME:-postgres}
      DB_PASSWORD: ${DATA_DB_PASSWORD:?Set DATA_DB_PASSWORD}
      DB_DATABASE: ${DATA_DB_DATABASE:-pipesight}
      DB_ECHO: "false"
      REDIS_HOST: ruoyi-redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 2
      TRANSPORT_CRYPTO_ENABLED: "false"
      PIPELINE_AUTO_BOOTSTRAP_SOURCES: "true"
      PIPELINE_TASK_SCHEDULER_ENABLED: "false"
      PIPELINE_INTERNAL_TOKEN: ${PIPELINE_INTERNAL_TOKEN:-pipesight-local-internal}
      # 开发使用 docker-compose.local.yml；正式部署使用私有网络 ClamAV。
      FILE_SCAN_MODE: external
      FILE_SCAN_COMMAND: ${FILE_SCAN_COMMAND:-pipesight-file-scan}
      FILE_SCAN_HOST: pipesight-clamav
      FILE_SCAN_PORT: 3310
      PDF_DIGEST_FONT_PATH: /usr/share/fonts/truetype/arphic-gbsn00lp/gbsn00lp.ttf
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Provide the original JWT_SECRET_KEY}
      FILE_SCAN_TIMEOUT_SECONDS: ${FILE_SCAN_TIMEOUT_SECONDS:-30}
    volumes:
      - ruoyi-upload-data:/app/vf_admin/upload_path
      - ruoyi-worker-health:/app/vf_admin/task-worker
      - ${PIPESIGHT_FONT_DIR:-./deploy/fonts}:/app/fonts:ro
    depends_on:
      pipesight-clamav:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
      pipesight-db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - ruoyi-network

  # PipeSight 任务 Worker：采集、科研任务、报告导出和资料解析独立于 API 进程运行。
  pipesight-task-worker:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/backend.pg.Dockerfile
    image: ruoyi-backend-pg:latest
    command: ["sh", "-c", "pipesight-runtime-check && exec pipesight-task-worker --env dockerpg"]
    environment:
      APP_ENV: dockerpg
      APP_RELOAD: "false"
      APP_ROOT_PATH: /docker-api
      DB_TYPE: postgresql
      PYTHONPATH: /app/src:/app
      DB_HOST: ${DATA_DB_HOST:?Set the explicit target DATA_DB_HOST}
      DB_PORT: ${DATA_DB_PORT:-5432}
      DB_USERNAME: ${DATA_DB_USERNAME:-postgres}
      DB_PASSWORD: ${DATA_DB_PASSWORD:?Set DATA_DB_PASSWORD}
      DB_DATABASE: ${DATA_DB_DATABASE:-pipesight}
      DB_ECHO: "false"
      PIPELINE_AUTO_BOOTSTRAP_SOURCES: "true"
      PIPELINE_TASK_SCHEDULER_ENABLED: "true"
      REDIS_HOST: ruoyi-redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 2
      FILE_SCAN_MODE: external
      FILE_SCAN_COMMAND: ${FILE_SCAN_COMMAND:-pipesight-file-scan}
      FILE_SCAN_HOST: pipesight-clamav
      FILE_SCAN_PORT: 3310
      PDF_DIGEST_FONT_PATH: /usr/share/fonts/truetype/arphic-gbsn00lp/gbsn00lp.ttf
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Provide the original JWT_SECRET_KEY}
      FILE_SCAN_TIMEOUT_SECONDS: ${FILE_SCAN_TIMEOUT_SECONDS:-30}
    volumes:
      - ruoyi-upload-data:/app/vf_admin/upload_path
      - ruoyi-worker-health:/app/vf_admin/task-worker
      - ${PIPESIGHT_FONT_DIR:-./deploy/fonts}:/app/fonts:ro
    depends_on:
      pipesight-clamav:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
      pipesight-db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "pipesight-worker-health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    networks:
      - ruoyi-network

  # Private scanner; signatures persist across restarts and FreshClam keeps them updated.
  pipesight-clamav:
    image: clamav/clamav:1.5
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - clamav-signatures:/var/lib/clamav
    networks:
      - ruoyi-network

  # Redis服务
  ruoyi-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ruoyi-redis-data:/data
    ports:
      - "127.0.0.1:16379:6379"
    networks:
      - ruoyi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  ruoyi-network:
    driver: bridge

volumes:
  ruoyi-upload-data:
  ruoyi-worker-health:
  ruoyi-redis-data:
  clamav-signatures:
