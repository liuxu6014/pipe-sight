name: pipesight-pg

services:
  # 数据库迁移：API 和持久任务 Worker 启动前必须完成 Alembic 迁移。
  # 数据库统一使用 172.16.4.183 上的 pipesight 库；本项目不再随 docker 启动本地 PG。
  pipesight-db-migrate:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/backend.pg.Dockerfile
    image: ruoyi-backend-pg:latest
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: dockerpg
      DB_TYPE: postgresql
      PYTHONPATH: /app/src:/app
      DB_HOST: 172.16.4.183
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DATA_DB_PASSWORD}
      DB_DATABASE: pipesight
      DB_ECHO: "false"
    networks:
      - ruoyi-network

  # 前端服务
  ruoyi-frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/docker/frontend.Dockerfile
    image: ruoyi-frontend:latest
    ports:
      - "12580:80"
    volumes:
      - ./deploy/nginx/postgres.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      ruoyi-backend-pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ruoyi-network

  # 后端服务（PostgreSQL版本）
  ruoyi-backend-pg:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/backend.pg.Dockerfile
    image: ruoyi-backend-pg:latest
    environment:
      APP_ENV: dockerpg
      DB_TYPE: postgresql
      PYTHONPATH: /app/src:/app
      DB_HOST: 172.16.4.183
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DATA_DB_PASSWORD}
      DB_DATABASE: pipesight
      DB_ECHO: "false"
      REDIS_HOST: ruoyi-redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 2
      TRANSPORT_CRYPTO_ENABLED: "false"
      PIPELINE_AUTO_BOOTSTRAP_SOURCES: "true"
      PIPELINE_TASK_SCHEDULER_ENABLED: "false"
      PIPELINE_INTERNAL_TOKEN: ${PIPELINE_INTERNAL_TOKEN:-pipesight-local-internal}
      # 本地验收默认使用基础检查；生产必须改为 external 并配置 ClamAV 等专业扫描器。
      FILE_SCAN_MODE: ${FILE_SCAN_MODE:-basic}
      FILE_SCAN_COMMAND: ${FILE_SCAN_COMMAND:-}
      FILE_SCAN_TIMEOUT_SECONDS: ${FILE_SCAN_TIMEOUT_SECONDS:-30}
    ports:
      - "19099:9099"
    volumes:
      - ruoyi-upload-data:/app/vf_admin/upload_path
    depends_on:
      ruoyi-redis:
        condition: service_healthy
      pipesight-db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - ruoyi-network

  # PipeSight 任务 Worker：采集、科研任务、报告导出和资料解析独立于 API 进程运行。
  pipesight-task-worker:
    build:
      context: ./backend
      dockerfile: ../deploy/docker/backend.pg.Dockerfile
    image: ruoyi-backend-pg:latest
    command: ["pipesight-task-worker", "--env", "dockerpg"]
    environment:
      APP_ENV: dockerpg
      DB_TYPE: postgresql
      PYTHONPATH: /app/src:/app
      DB_HOST: 172.16.4.183
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DATA_DB_PASSWORD}
      DB_DATABASE: pipesight
      DB_ECHO: "false"
      PIPELINE_AUTO_BOOTSTRAP_SOURCES: "true"
      PIPELINE_TASK_SCHEDULER_ENABLED: "true"
      FILE_SCAN_MODE: ${FILE_SCAN_MODE:-basic}
      FILE_SCAN_COMMAND: ${FILE_SCAN_COMMAND:-}
      FILE_SCAN_TIMEOUT_SECONDS: ${FILE_SCAN_TIMEOUT_SECONDS:-30}
    volumes:
      - ruoyi-upload-data:/app/vf_admin/upload_path
    depends_on:
      pipesight-db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - ruoyi-network

  # Redis服务
  ruoyi-redis:
    image: redis:latest
    ports:
      - "16379:6379"
    networks:
      - ruoyi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  ruoyi-network:
    driver: bridge

volumes:
  ruoyi-upload-data:
