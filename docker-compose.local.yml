name: pipesight-local

# Host-run API/Worker use backend/.env.dev; services are exposed only on loopback.
# PostgreSQL 已移除：本地开发统一连 172.16.4.183 的 pipesight 库（在 backend/.env.dev 里配 DB_HOST）。
# docker compose --env-file backend/.env.dev -f docker-compose.local.yml up -d
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:26379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  redis-data:
